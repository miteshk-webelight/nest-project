services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${PORT}:3000"

    env_file:
      - .env

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${DATABASE_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    ports:
      - "${REDIS_EXTERNAL_PORT}:${REDIS_PORT}"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  node_modules: